# AlgoT2V project-wide Manim config (read by every manim render launched from
# the project root, i.e. by rendering/manim_renderer.py).
#
# disable_caching = True is REQUIRED, do not turn it off.
#
# Manim's animation cache is incompatible with manim-voiceover. When an
# animation is served from cache, Manim sets renderer.skip_animations = True,
# and Scene.add_sound() early-returns whenever that flag is set. manim-voiceover
# adds each block's narration via add_sound() at the start of the next block, so
# with caching ON every cached re-render drops the audio -> a SILENT video.
# Keeping caching off makes every animation (and its voiceover) render for real,
# so the output always has sound. This costs render time but correctness wins.
#
# IMPORTANT: keep this file ASCII-only. Manim reads it with the system default
# codec (gbk on a Chinese Windows locale), so any non-ASCII byte raises
# UnicodeDecodeError and breaks ALL rendering.
[CLI]
disable_caching = True
